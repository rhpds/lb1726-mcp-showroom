---
type: showroom

# Set the left column width to 40%
default_width: 40
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true
# Enable view switcher (instructions, split, tabs)
view_switcher:
  enabled: true
  default_mode: split

tabs:
- name: OpenShift Console
  url: 'https://console-openshift-console.${DOMAIN}'
- name: LibreChat
  url: 'https://librechat-${USER}-2-librechat.${DOMAIN}'
- name: Gitea
  url: 'https://gitea-${USER}-5-gitea.${DOMAIN}'
